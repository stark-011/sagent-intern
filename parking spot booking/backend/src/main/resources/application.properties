spring.application.name=parking-spot-finder-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parking_spot_finder_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456789}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.time-zone=Asia/Kolkata

app.jwt.secret=${JWT_SECRET:ReplaceWithAtLeast256BitSecretKeyForLocalDevOnlyChangeMe1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.seed.enabled=${APP_SEED_ENABLED:false}

springdoc.swagger-ui.path=/swagger-ui.html

# ── Mail (Gmail SMTP) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sabariwithcoc@gmail.com}
spring.mail.password=${MAIL_PASSWORD:gglryaggpaghtqdb}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── OTP Settings ──
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
